name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash -n install.sh reset-admin.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: docker build -t xiazai-test .
      - run: node scripts/docker-smoke.mjs xiazai-test
      - run: node scripts/docker-disk-smoke.mjs xiazai-test
      - run: node scripts/docker-updater-smoke.mjs xiazai-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification
          path: .verification/

name: Public installation smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test public installer and password reset
        run: sudo --preserve-env=PATH bash scripts/install-smoke.sh

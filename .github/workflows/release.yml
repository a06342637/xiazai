name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate version and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          test "v$VERSION" = "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/draft 2>/dev/null; then
            test "$(cat /tmp/draft)" = true || { echo 'Public releases are immutable'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "XIAZAI $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: bash -n install.sh reset-admin.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/a06342637/xiazai:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published Docker image
        env:
          IMAGE: ghcr.io/a06342637/xiazai@${{ steps.image.outputs.digest }}
        run: node scripts/docker-smoke.mjs "$IMAGE"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ghcr.io/a06342637/xiazai@${{ steps.image.outputs.digest }}
        run: |
          node -e 'require("fs").writeFileSync("release.json",JSON.stringify({schema:1,version:process.env.VERSION,image:process.env.RELEASE_IMAGE},null,2))'
          gh release upload "$GITHUB_REF_NAME" release.json compose.yml install.sh reset-admin.sh --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-verification
          path: .verification/
